name: Android Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

permissions:
  contents: write

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.MYSPOTI_STABLE_KEYSTORE_BASE64 }}
      # Where the app looks for updates (GitHub Releases). Same repo by default; to keep the code private,
      # make a public repo that only holds releases and set the variable UPDATE_REPO (owner/name) + secret UPDATE_TOKEN.
      REPO: ${{ vars.UPDATE_REPO || github.repository }}
      # Where the app looks for updates (GitHub Releases). Same repo by default; to keep the code private,
      # make a public repo that only holds releases and set the variable UPDATE_REPO (owner/name) + secret UPDATE_TOKEN.
      REPO: ${{ vars.UPDATE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Con la tua chiave (secret) l'APK si aggiorna sopra quello gia' installato.
      # Senza chiave la build parte lo stesso ("-beta", firmata con una chiave di prova):
      # ogni APK e' firmato diversamente, quindi va prima disinstallata la versione precedente.
      - name: Keystore
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MYSPOTI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "MYSPOTI_KEYSTORE_PASSWORD=${{ secrets.MYSPOTI_STABLE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MYSPOTI_KEY_ALIAS=${{ secrets.MYSPOTI_STABLE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MYSPOTI_KEY_PASSWORD=${{ secrets.MYSPOTI_STABLE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${{ github.run_number }}-beta" >> "$GITHUB_ENV"
          fi

      # Release = ottimizzata (R8, risorse ridotte): molto piu' fluida della debug.
      - name: Build Release APK
        run: ./gradlew assembleRelease :app:collectApks -PappVersionName="$VERSION" -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))" -PupdateRepo="$REPO" -PupdateRepo="$REPO"

      - uses: actions/upload-artifact@v4
        with:
          name: dormire-apk
          path: base/app/build/release-apks/*.apk
          retention-days: 14

      # The release the app's update window finds: tag v<version>, one APK per phone type.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$VERSION" in *-beta*) PRE="--prerelease" ;; esac
          gh release create "v$VERSION" app/build/release-apks/*.apk --repo "$REPO" --title "Dormire $VERSION" --notes "Dormire $VERSION" $PRE

      # The release the app's update window finds: tag v<version>, one APK per phone type.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$VERSION" in *-beta*) PRE="--prerelease" ;; esac
          gh release create "v$VERSION" app/build/release-apks/*.apk --repo "$REPO" --title "Dormire $VERSION" --notes "Dormire $VERSION" $PRE
